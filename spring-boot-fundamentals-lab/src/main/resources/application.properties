# =============================================
# Spring Boot Fundamentals Lab - Configuration
# =============================================

# The port the embedded Tomcat server listens on.
# Default is 8080. Change this if 8080 is already in use on your machine.
server.port=8080

# Application name - used in logs and actuator info
spring.application.name=spring-boot-fundamentals-lab

# =============================================
# Logging configuration
# =============================================

# Logging level for our own code. Options: TRACE, DEBUG, INFO, WARN, ERROR
# INFO is the default for production. Use DEBUG during development to see more output.
logging.level.com.example.lab=DEBUG

# Logging level for Spring Framework internals.
# Keep this at INFO or WARN - Spring is very verbose at DEBUG level.
logging.level.org.springframework=INFO

# =============================================
# Custom application properties
# =============================================

# This is a custom property we define ourselves.
# We will inject this value into our GreetingService using @Value.
# This demonstrates how to make your application configurable without changing code.
#
# Try changing this value and restarting - the behavior changes without touching Java code!
app.greeting.message=Hello from Spring Boot!
app.greeting.author=Spring Boot Fundamentals Lab
